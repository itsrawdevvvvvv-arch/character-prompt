<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shinkai Character Prompt — Autofill</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9dadb;--tile:#e9e9e9;--ink:#263133;--mut:#6a7678;--sh:rgba(38,49,51,.28);--acc:#3d5a80;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2123;--tile:#262e31;--ink:#e4e7e7;--mut:#8f9b9d;--sh:rgba(0,0,0,.5);--acc:#9db8da;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b2123;--tile:#262e31;--ink:#e4e7e7;--mut:#8f9b9d;--sh:rgba(0,0,0,.5);--acc:#9db8da;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.35 'Patrick Hand',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'Share Tech Mono',monospace}
main{max-width:760px;margin:0 auto;padding:18px 14px 130px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;position:relative;z-index:1}
.w{background:var(--tile);border:2px solid var(--ink);border-radius:28px;box-shadow:0 5px 0 var(--sh);padding:16px 18px;opacity:0;animation:in .8s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--i)*90ms);min-width:0}
@keyframes in{from{opacity:0;transform:translateY(28px) scale(.94);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
@media(max-width:640px){.s4,.s3{grid-column:span 6}.s2{grid-column:span 3}}
.days{display:flex;justify-content:space-between;background:var(--ink);color:var(--tile);border-radius:99px;padding:3px 12px;font-size:13px;letter-spacing:.5px;margin-bottom:12px}
.days span.on{text-decoration:underline}
.date{display:flex;gap:14px;align-items:center}
.big{background:var(--ink);color:var(--tile);border-radius:18px;font:46px 'Share Tech Mono',monospace;padding:6px 12px;line-height:1}
.date h1{margin:0;font-size:clamp(24px,5vw,38px);letter-spacing:1px;line-height:1}
.date small{display:block;color:var(--mut);font-size:16px;margin-bottom:4px}
.quote{font-size:22px;line-height:1.3}.quote:before{content:"";display:inline-block;width:6px;height:18px;background:var(--ink);border-radius:9px;margin-right:8px;vertical-align:-2px}
.clock{font:clamp(40px,10vw,64px) 'Share Tech Mono',monospace;letter-spacing:2px;line-height:1;display:flex;justify-content:space-between;align-items:flex-start}
.clock small{font:16px 'Patrick Hand';letter-spacing:1px}
.btn{cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;color:var(--ink);text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}.btn:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 var(--sh)}
.play{flex-direction:column;font-size:18px}.play svg{width:46px;height:46px;transition:transform .4s}.play:hover svg{transform:translateX(5px) scale(1.1)}
.dark{background:var(--ink);color:var(--tile)}.dark *{color:var(--tile)}
.soc{font-size:22px;justify-content:flex-start;gap:14px}.soc svg{width:34px;height:34px;flex:none}.soc small{display:block;font-size:14px;color:var(--mut)}.dark small{color:var(--tile);opacity:.7}
.cnt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:20px}
.cnt b{background:var(--ink);color:var(--tile);border-radius:12px;width:44px;height:50px;display:grid;place-items:center;font:30px 'Share Tech Mono',monospace;overflow:hidden}
.cnt b i{font-style:normal;display:block;animation:flip .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes flip{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.bar{height:22px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--tile);margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ph h2{margin:0;font-size:28px}.row{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:2px solid var(--ink);border-radius:99px;padding:8px 20px;background:var(--tile);box-shadow:0 4px 0 var(--sh);font-size:20px}
.pill.dark,.pill.on{background:var(--ink);color:var(--tile)}.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 4px;font-size:20px}
.prompt{font-size:18px;line-height:1.55;max-height:64vh;overflow:auto;padding:6px 6px 6px 0;margin:10px 0 14px;border-top:2px dashed var(--mut);scrollbar-width:thin}
.prompt h3{margin:16px 0 4px;font-size:20px;color:var(--acc)}.prompt p{margin:6px 0}
.prompt ul{margin:0;padding-left:18px;list-style:"– "}
.prompt li{padding:1px 0}
.v{color:var(--mut)}.v.f{color:var(--tile);background:var(--ink);border-radius:8px;padding:0 8px;display:inline-block;animation:pop .55s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--d)}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.foot{text-align:center;color:var(--mut);font-size:16px}.foot a{color:var(--ink)}
.leaf{position:fixed;top:-40px;width:26px;height:26px;z-index:0;opacity:.35;fill:var(--ink);animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(540deg)}}
/* dock — expanding tab bar */
.dock{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));display:flex;gap:10px;align-items:flex-end;z-index:20;animation:in .9s .8s cubic-bezier(.34,1.56,.64,1) backwards}
.tabs{flex:1;display:flex;justify-content:space-around;background:var(--tile);border:2px solid var(--ink);border-radius:99px;padding:6px;box-shadow:0 5px 0 var(--sh);transition:all .5s cubic-bezier(.34,1.3,.64,1)}
.tabs a{width:48px;height:42px;border-radius:99px;display:grid;place-items:center;color:var(--ink);text-decoration:none;font-size:22px;transition:background .3s,transform .3s}
.tabs a.on{background:var(--ink);color:var(--tile)}.tabs a:hover{transform:translateY(-3px)}
.fab{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:var(--tile);font:34px/1 'Share Tech Mono';cursor:pointer;box-shadow:0 5px 0 var(--sh);flex:none;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.fab:active{transform:scale(.9)}.open .fab{transform:rotate(135deg)}
.menu{position:absolute;right:0;bottom:70px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:var(--tile);border:2px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--sh);transform-origin:bottom right;opacity:0;transform:scale(.3);filter:blur(14px);pointer-events:none;transition:all .5s cubic-bezier(.34,1.4,.64,1)}
.menu button{aspect-ratio:1;border:2px solid var(--ink);border-radius:16px;background:var(--bg);color:var(--ink);font:15px 'Patrick Hand';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;opacity:0;transform:scale(.6);transition:all .4s cubic-bezier(.34,1.56,.64,1);transition-delay:calc(var(--k)*35ms)}
.menu button span{font-size:24px}.menu button:active{background:var(--ink);color:var(--tile)}
.open .menu{opacity:1;transform:none;filter:none;pointer-events:auto}.open .menu button{opacity:1;transform:none}
.open .tabs{opacity:0;filter:blur(8px);transform:scale(.85);pointer-events:none}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--tile);border-radius:99px;padding:8px 20px;z-index:30;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}.toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}.leaf{display:none}}
.hd{max-width:760px;margin:0 auto;padding:30px 18px 0;animation:in .8s backwards}.hd h1{margin:0;font-size:clamp(32px,8vw,48px);letter-spacing:1px}.hd p{color:var(--mut);margin:2px 0 0}.leaf{display:none}</style></head><body>
<header class="hd"><h1>Character Prompt</h1><p>Shinkai-style · choose a character, hit autofill</p></header>
<main id="top">
 <section class="w s6" style="--i:0" id="prompt"><div class="ph"><h2>The Prompt</h2><div class="row"><button class="pill btn dark" id="af">✦ Autofill</button><button class="pill btn" id="cp">⧉ Copy</button><button class="pill btn" id="rs">↺ Reset</button></div></div><div class="chips" id="gc">Character: <button class="pill btn" data-g="Male">♂ Male</button><button class="pill btn" data-g="Female">♀ Female</button><button class="pill btn on" data-g="">Any</button></div><div class="prompt" id="pt"></div></section>
 <p class="foot s6 w" style="--i:9;border:0;box-shadow:none;background:none">made by Dev · <a href="https://www.instagram.com/rawde_vvvvvv?cplk=MWdweGJ0NG1jNXJ4Zg==" target="_blank" rel="noopener">Instagram</a> · <a href="https://youtube.com/@raw.devvvvvv?si=UORQip4W2TaeY2mE" target="_blank" rel="noopener">YouTube</a></p>
</main>
<div class="toast" id="toast"></div>
<nav class="dock" id="dock"><div class="tabs"><a class="on" href="#top" aria-label="Home">⌂</a><a href="#prompt" aria-label="Prompt">✎</a><a href="#top" id="tt" aria-label="Theme">◐</a><a href="https://www.instagram.com/rawde_vvvvvv?cplk=MWdweGJ0NG1jNXJ4Zg==" target="_blank" rel="noopener" aria-label="Instagram">◎</a></div>
<div class="menu"><button style="--k:0" data-a="af"><span>✦</span>Autofill</button><button style="--k:1" data-a="cp"><span>⧉</span>Copy</button><button style="--k:2" data-a="rs"><span>↺</span>Reset</button><button style="--k:3" data-a="th"><span>◐</span>Theme</button></div>
<button class="fab" id="fab" aria-label="Menu">+</button></nav>
<script>
const $=s=>document.querySelector(s);
const INTRO="Create a full-body anime character in Makoto Shinkai-inspired cinematic style with a dreamy, soft, highly detailed, emotionally expressive aesthetic. The character should maintain the same facial structure, hairstyle, clothing silhouette, proportions, and overall visual identity as the provided reference image while adapting all customizable attributes below. Preserve character consistency, premium anime rendering, and polished illustration quality.";
const COL="Black/White/Navy/Beige/Olive/Maroon/Sky Blue/Charcoal/Cream/Forest Green/Mustard/Lavender";
const S=[
["Character Details",["Gender|Male/Female/Androgynous","Age Appearance|Teen/Young Adult/Adult","Height|Short/Average/Tall","Body Type|Slim/Skinny/Chubby/Athletic/Aesthetic Lean Physique/Muscular","Face Shape|Oval/Round/Heart/Square/Sharp Jawline","Jawline|Soft/Defined/Sharp","Cheek Structure|Soft/Defined","Chin Shape|Rounded/Pointed","Skin Tone|Fair/Light Beige/Wheatish/Tan/Brown/Dark","Skin Texture|Smooth/Natural/Freckled","Eye Colour|Black/Dark Brown/Brown/Hazel/Blue/Green/Grey","Eye Shape|Large Anime Eyes/Almond/Sharp/Soft/Round","Eyelashes|Short/Medium/Long","Eyebrows|Thin/Thick/Straight/Curved","Nose Style|Small/Straight/Defined","Lip Style|Thin/Natural/Soft","Expression|Happy/Calm/Serious/Confident/Smiling/Angry/Sad/Playful"]],
["Hair Details",["Hair Colour|Black/Brown/Blonde/White/Silver/Red/Blue/Pink/Lavender/Teal/Ash Grey/Burgundy","Hair Style|Messy Layered/Wolf Cut/Curtain Hair/Straight/Wavy/Curly/Spiky/Ponytail/Bun/Long Flowing","Hair Length|Short/Medium/Long","Hair Volume|Low/Medium/High","Hair Texture|Silky/Soft/Fluffy/Messy/Wavy","Bangs|Yes/No/Side Bangs/Curtain Bangs","Hair Shine|Matte/Natural/Glossy"]],
["Clothing",["Outfit Style|Casual/Streetwear/School Uniform/Formal/Fantasy/Techwear/Traditional/Modern","Top|T-shirt/Hoodie/Jacket/Shirt/Sweater","Inner Layer|None/Long Sleeve/Tank Top/Shirt","Bottom|Jeans/Cargo Pants/Shorts/Joggers/Skirt","Footwear|Sneakers/Boots/Loafers/Sandals","Clothing Fit|Oversized/Relaxed/Slim Fit/Regular Fit","Primary Clothing Colour|"+COL,"Secondary Clothing Colour|"+COL,"Clothing Pattern|Plain/Graphic/Striped/Checkered/Printed"]],
["Accessories",["Necklace|None/Chain/Cross/Pendant","Earrings|None/Stud/Hoop","Rings|None/Silver/Gold","Bracelet|None/Leather/Metal","Watch|None/Digital/Analog","Glasses|None/Round/Square","Head Accessories|Cap/Beanie/Headphones/None","Bag|Crossbody/Backpack/Sling Bag/None"]],
["Pose",["Pose|Standing/Peace Sign/Pointing/Hands in Pocket/Walking/Sitting/Running","Hand Gesture|Peace Sign/Thumbs Up/Open Palm/Finger Heart/None","Camera Angle|Front/Three Quarter/Side/Low Angle/High Angle","Framing|Portrait/Half Body/Full Body/Close Up","Head Direction|Looking at Camera/Looking Away/Looking Down/Looking Up"]]];
const T=[["Environment",["Background: Solid White Background"]],
["Art Style","Makoto Shinkai-inspired anime illustration|Highly detailed digital painting|Soft cinematic lighting|Beautiful color harmony|Dreamlike atmosphere|Smooth gradients|Rich environmental lighting|Clean line art|Elegant anime rendering|Vibrant yet natural colours|High-quality illustration|Premium anime artwork|Professional composition|Consistent character design|Expressive facial features|Sharp focus|Ultra HD|8K quality".split("|")],
["Quality Tags","Masterpiece|Best Quality|Ultra Detailed|High Resolution|Professional Anime Illustration|Perfect Anatomy|Clean Linework|Beautiful Lighting|Sharp Details|Cinematic Composition".split("|")],
["Negative Prompt","Low quality|Blurry|Pixelated|Bad anatomy|Extra fingers|Missing fingers|Extra limbs|Cropped body|Deformed face|Uneven eyes|Wrong proportions|Distorted hands|Mutated anatomy|Duplicate body parts|Bad shading|Oversaturated colours|Watermark|Logo|Text|Signature|Noise|Artifacts|Out of frame|Low resolution|Realistic photo style|3D render|CGI|Plastic skin".split("|")]];
const F=S.flatMap(s=>s[1].map(f=>{const[a,b]=f.split("|");return{k:a,o:b.split("/")}}));
let val={},prev={},n=0,G="";
const pick=a=>a[Math.random()*a.length|0];
function roll(){const v={};F.forEach(f=>{const o=f.o.filter(x=>x!==prev[f.k]);v[f.k]=pick(o.length?o:f.o)});
 if(G)v["Gender"]=G;if(v["Gender"]==="Male"&&v["Bottom"]==="Skirt")v["Bottom"]=pick(["Jeans","Cargo Pants","Joggers"]);
 if(v["Primary Clothing Colour"]===v["Secondary Clothing Colour"])v["Secondary Clothing Colour"]=pick(F.find(f=>f.k==="Secondary Clothing Colour").o.filter(x=>x!==v["Primary Clothing Colour"]));
 return v}
function render(){let h="<p>"+INTRO+"</p>",i=0;
 S.forEach(([t,fs])=>{h+="<h3>"+t+"</h3><ul>"+fs.map(x=>{const f=F.find(q=>q.k===x.split("|")[0]);const c=val[f.k];
 return "<li>"+f.k+": "+(c?'<span class="v f" style="--d:'+(i++*28)+'ms">'+c+"</span>":'<span class="v">['+f.o.join(" / ")+"]</span>")+"</li>"}).join("")+"</ul>"});
 T.forEach(([t,l])=>{h+="<h3>"+t+"</h3><ul>"+l.map(x=>"<li>"+x+"</li>").join("")+"</ul>"});
 $("#pt").innerHTML=h;}
function text(){let o=INTRO+"\n";S.forEach(([t,fs])=>{o+="\n"+t+"\n"+fs.map(x=>{const f=F.find(q=>q.k===x.split("|")[0]);return "- "+f.k+": "+(val[f.k]||"["+f.o.join(" / ")+"]")}).join("\n")+"\n"});
 T.forEach(([t,l])=>o+="\n"+t+"\n"+l.map(x=>x.includes(":")?"- "+x:"- "+x).join("\n")+"\n");return o}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),1800)}
function auto(){val=roll();prev={...val};n++;render();toast("New character filled ✦");$("#pt").scrollTo({top:0,behavior:"smooth"})}
function copy(){const t=text();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Prompt copied ⧉")).catch(()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Prompt copied ⧉")}catch(e){toast("Copy not allowed")}a.remove()})}
function reset(){val={};render();toast("Reset ↺")}
function theme(){const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches;const cur=r.dataset.theme||(d?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark"}
const go=u=>window.open(u,"_blank","noopener");
const IG="https://www.instagram.com/rawde_vvvvvv?cplk=MWdweGJ0NG1jNXJ4Zg==",YT="https://youtube.com/@raw.devvvvvv?si=UORQip4W2TaeY2mE";
const A={af:auto,cp:copy,rs:reset,th:theme,ig:()=>go(IG),yt:()=>go(YT),up:()=>scrollTo({top:0,behavior:"smooth"}),pr:()=>$("#prompt").scrollIntoView({behavior:"smooth"})};
["af"].forEach(i=>$("#"+i).onclick=auto);$("#cp").onclick=copy;$("#rs").onclick=reset;document.querySelectorAll("#gc button").forEach(b=>b.onclick=()=>{G=b.dataset.g;document.querySelectorAll("#gc button").forEach(x=>x.classList.toggle("on",x===b));if(Object.keys(val).length)auto();else toast((G||"Any")+" selected")});
$("#tt").onclick=e=>{e.preventDefault();theme()};
$("#fab").onclick=()=>{const d=$("#dock");d.classList.toggle("open");$("#fab").textContent=d.classList.contains("open")?"+":"+"};
document.querySelectorAll(".menu button").forEach(b=>b.onclick=()=>{A[b.dataset.a]();$("#dock").classList.remove("open")});
document.addEventListener("click",e=>{if(!e.target.closest("#dock"))$("#dock").classList.remove("open")});
document.querySelectorAll(".tabs a[href^='#']").forEach(a=>a.addEventListener("click",()=>{document.querySelectorAll(".tabs a").forEach(x=>x.classList.remove("on"));a.classList.add("on")}));
render();
</script></body></html>
